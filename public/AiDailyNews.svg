<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#000000"/>
  
  <!-- Container -->
  <g transform="translate(50, 50)">
    <!-- Main container background -->
    <rect width="800" height="600" rx="20" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
    
    <!-- Header -->
    <rect width="800" height="100" rx="20" fill="#000000"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#1a1a1a" stroke-width="1"/>
    
    <!-- Title with gradient effect -->
    <defs>
      <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#888888;stop-opacity:1" />
      </linearGradient>
    </defs>
    
    <text x="400" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="url(#titleGradient)" text-anchor="middle">DailyNews AI</text>
    <text x="400" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle" opacity="0.6">Your AI-powered news assistant</text>
    
    <!-- Chat area background -->
    <rect y="100" width="800" height="400" fill="#0a0a0a"/>
    
    <!-- Welcome message -->
    <text x="400" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle">👋 Welcome to DailyNews AI</text>
    <text x="400" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#888888" text-anchor="middle">Ask me anything about current events, technology,</text>
    <text x="400" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#888888" text-anchor="middle">or any topic you're curious about!</text>
    
    <!-- Suggestion chips -->
    <g transform="translate(180, 330)">
      <!-- Chip 1 -->
      <rect width="140" height="40" rx="20" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="2"/>
      <text x="70" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Latest tech news</text>
    </g>
    
    <g transform="translate(330, 330)">
      <!-- Chip 2 -->
      <rect width="140" height="40" rx="20" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="2"/>
      <text x="70" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">AI developments</text>
    </g>
    
    <g transform="translate(480, 330)">
      <!-- Chip 3 -->
      <rect width="140" height="40" rx="20" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="2"/>
      <text x="70" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Market updates</text>
    </g>
    
    <!-- Input container -->
    <line x1="0" y1="500" x2="800" y2="500" stroke="#1a1a1a" stroke-width="1"/>
    <rect y="500" width="800" height="100" fill="#000000"/>
    
    <!-- Input field -->
    <rect x="30" y="525" width="630" height="50" rx="25" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="2"/>
    <text x="50" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#555555">Type your topic or question...</text>
    
    <!-- Send button -->
    <rect x="680" y="525" width="90" height="50" rx="25" fill="#ffffff"/>
    <text x="725" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#000000" text-anchor="middle">Send</text>
  </g>
</svg>